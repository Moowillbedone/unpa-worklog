<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>업무일지 동기화</title>
<style>
  :root{--bg:#f6f8f7;--card:#fff;--line:#dde3e1;--ink:#16211d;--dim:#5a6b65;--ok:#0d9668;--bad:#c8443c}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1512;--card:#132019;--line:#22392e;--ink:#e8f1ed;--dim:#9fb4ab;--ok:#3ddc97;--bad:#ff8f6b}}
  body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  .box{margin:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .t{font-weight:800;font-size:15px}
  .st{margin-top:8px;color:var(--dim)}
  .st b{color:var(--ink)}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  ul{margin:8px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px;max-height:120px;overflow:auto}
  a{color:var(--ok);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="t">📒 업무일지 자동 동기화</div>
  <div class="st" id="st">검수 콘솔 연결 중…</div>
  <ul id="chg" hidden></ul>
  <div class="st" style="font-size:12px"><a href="./" target="_blank" rel="noopener">업무일지 열기 ↗</a> · 반영이 끝나면 이 창은 저절로 닫힙니다.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="worklog-core.js?v=13"></script>
<script>
/* 검수 콘솔(cms.unpa.me)이 이 창을 열고 CMS 집계를 넘긴다.
   여기서 이 브라우저의 업무일지·검수기록 저장소에 반영하고 결과를 돌려준 뒤 닫힌다.
   이 창을 연 콘솔 창, 그 창의 주소(cms.unpa.me), 주소에 붙은 일회용 번호가 모두 맞을 때만 받는다. */
(function(){
  var CMS='https://cms.unpa.me';
  var st=document.getElementById('st'), chg=document.getElementById('chg');
  var m=(location.hash||'').match(/^#n=([a-f0-9]{16,64})$/);
  if(!m || !window.opener){ st.textContent='검수 콘솔에서 열리는 창입니다. 업무일지는 위 링크로 여세요.'; return; }
  var nonce=m[1], src=window.opener, done=false;
  history.replaceState(null,'',location.pathname);

  /* 업무일지 서버(Supabase) — 업무일지 화면에서 로그인해 두었으면 그 로그인을 그대로 쓴다.
     로그인 전이면 이 브라우저에만 반영하고 콘솔에 그렇게 알린다. */
  var SB_DEFAULT={ url:'https://uqphctcinhbqjdiinlur.supabase.co',
    key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxcGhjdGNpbmhicWpkaWlubHVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MDg1NzEsImV4cCI6MjA5ODM4NDU3MX0.-BbeKCu8LsRgwSx6bfYPOmBRtU0ogydAEoyePdXuXRc' };
  async function cloudIO(){
    try{
      if(!window.supabase) return null;
      var c=null; try{ c=JSON.parse(localStorage.getItem('unpa-sb-cfg')||'null'); }catch(e){}
      if(!c || !c.url || !c.key) c=SB_DEFAULT;
      var sb=window.supabase.createClient(c.url, c.key, { auth:{ persistSession:true, autoRefreshToken:true } });
      var s=await sb.auth.getSession(), user=s && s.data && s.data.session ? s.data.session.user : null;
      if(!user) return null;
      var T='worklog_months';
      var chunk=function(list, size){ var out=[]; for(var i=0;i<list.length;i+=size) out.push(list.slice(i,i+size)); return out; };
      var token=s.data.session.access_token;
      return { uid:user.id, io:{
        /* 서버 시각과 이 컴퓨터 시계의 차(ms) — 응답 Date 헤더(1초 단위)로 잰다. 작업 권한은 시계가 1분 안일 때만 */
        skew: async function(){
          var t0=Date.now(), r=await fetch(c.url+'/rest/v1/'+T+'?select=month&limit=0', { headers:{ apikey:c.key, Authorization:'Bearer '+token }, cache:'no-store' }), t1=Date.now();
          var d=Date.parse(r.headers.get('Date')||''); if(!isFinite(d)) return null;
          return d+500-(t0+t1)/2;
        },
        /* 이전 판의 계정별 권한 행 목록 — 새 권한을 처음 낼 때 다른 기기 것이 살아 있는지 본다 */
        list: async function(prefix){
          var r=await sb.from(T).select('month,data,updated_at').eq('user_id',user.id).like('month', prefix+'%');
          if(r.error) throw r.error; return r.data||[];
        },
        /* 작업 권한 행을 '안 바뀌었으면'만 쓴다: 없으면 insert(겹치면 실패), 있으면 그 nonce 일 때만 update */
        claim: async function(K, expect, data){
          var at=new Date().toISOString(), r;
          if(!expect){
            r=await sb.from(T).insert({ user_id:user.id, month:K, data:data, updated_at:at }).select('month');
            if(r.error){ if(String(r.error.code)==='23505') return false; throw r.error; }
            return (r.data||[]).length===1;
          }
          var q=sb.from(T).update({ data:data, updated_at:at }).eq('user_id',user.id).eq('month',K);
          q = expect.nonce==null ? q.is('data->>nonce', null) : q.eq('data->>nonce', expect.nonce);
          r=await q.select('month'); if(r.error) throw r.error;
          return (r.data||[]).length===1;
        },
        pull: async function(keys){
          var all=[], parts=chunk(keys, 40);
          for(var i=0;i<parts.length;i++){
            var r=await sb.from(T).select('month,data,updated_at').eq('user_id',user.id).in('month',parts[i]);
            if(r.error) throw r.error; all=all.concat(r.data||[]);
          }
          return all;
        },
        push: async function(rows){
          /* 한 번에 너무 크게 보내지 않도록 나눠 올린다 */
          var batch=[], size=0;
          var flush=async function(){ if(!batch.length) return; var r=await sb.from(T).upsert(batch.map(function(x){ return Object.assign({user_id:user.id},x); }),{onConflict:'user_id,month'}); if(r.error) throw r.error; batch=[]; size=0; };
          for(var i=0;i<rows.length;i++){ var n=JSON.stringify(rows[i].data).length; if(size+n>800000) await flush(); batch.push(rows[i]); size+=n; }
          await flush();
        } } };
    }catch(e){ return null; }
  }
  async function apply(p){
    var base=null;
    /* 이 브라우저에 업무일지가 아직 없으면 저장소의 기존 기록(data/log.json)부터 깐다 — 과거 달이 사라지지 않게 */
    if(!localStorage.getItem(localStorage.getItem('unpa-worklog-active')||'unpa-worklog-v1') && !localStorage.getItem('unpa-worklog-v1')){
      try{ var r=await fetch('data/log.json?t='+Date.now(),{cache:'no-store'}); if(r.ok){ var o=await r.json(); base={v:1,months:(o&&o.months)||o,dirty:[]}; } }catch(e){}
    }
    st.textContent='업무일지 서버 확인 중…';
    var c=await CLOUD;
    st.textContent=c ? '다른 컴퓨터 기록과 합치는 중…' : '이 브라우저에 반영 중…';
    if(c && !EXC_PULLED) try{ await pullExc(c); }catch(e){}     /* 준비 신호 전에 못 받았으면 한 번 더 */
    return WorklogCore.syncWindow(localStorage, p, c && c.io, { uid:c && c.uid, base:base });
  }
  /* 다른 컴퓨터에서 무시·복원한 검수 예외를 서버에서 받아 이 브라우저에 합쳐 둔다.
     준비 신호를 보내기 전에 해야 콘솔이 만드는 집계(수정완료 수)부터 맞는다. 무시 규칙을 아는 새 worklog-core 일 때만 */
  var CLOUD=cloudIO(), EXC_PULLED=false;
  async function pullExc(c){
    if(!c || !WorklogCore.EXC_IGN) return;
    var xr=await c.io.pull(['~exc']), xrow=xr && xr[0];
    if(xrow && xrow.data){
      var loc=null; try{ loc=JSON.parse(localStorage.getItem('unpa-exceptions-v1')||'null'); }catch(e){}
      localStorage.setItem('unpa-exceptions-v1', JSON.stringify(WorklogCore.mergeExceptions(loc, xrow.data)));
    }
    EXC_PULLED=true;
  }
  function within(p, ms){ return Promise.race([p, new Promise(function(r){ setTimeout(function(){ r(null); }, ms); })]); }
  function md(d){ return (+d.slice(5,7))+'/'+(+d.slice(8,10)); }
  /* 업무일지 검수 예외에서 '무시'한 리뷰 번호 — 콘솔이 수정완료 검토·전체 스캔에서 뺀다 */
  function ignoredIds(){
    try{ var o=JSON.parse(localStorage.getItem('unpa-exceptions-v1')||'null'), it=(o&&o.items)||{};
      return Object.keys(it).filter(function(k){ return it[k] && it[k].ign===true; }).map(String).slice(0,2000); }
    catch(e){ return null; }
  }
  function show(res){
    if(!res.ok){ st.innerHTML='<span class="bad">반영 실패</span> — '+String(res.error||'').replace(/[<>&]/g,''); return; }
    st.innerHTML='<span class="ok">반영 완료</span> · 오늘('+md(res.today.d)+') 리뷰 <b>'+res.today.r+'</b> · 제품 <b>'+res.today.p+'</b>'
      +(res.nChanges?' · 바뀐 날 '+res.nChanges+'일':' · 바뀐 날 없음')+(res.auditDays?' · 검수기록 '+res.auditDays+'일':'')
      +(res.auditError?' · <span class="bad">검수기록 저장 실패</span>':'')
      +(res.cloud==='on' ? '<br>☁ 다른 컴퓨터 기록과 합쳤습니다'
        : res.cloud==='off' ? '<br>☁ 업무일지에 로그인하면 회사·집 기록이 합쳐집니다'
        : '<br><span class="bad">☁ 서버 합치기 실패</span> — 이 브라우저에는 반영됨, 다음에 다시 합칩니다');
    if(res.changes.length){
      chg.hidden=false;
      chg.innerHTML=res.changes.map(function(c){
        var parts=[]; if(c.r[0]!==c.r[1]) parts.push('리뷰 '+c.r[0]+'→'+c.r[1]); if(c.p[0]!==c.p[1]) parts.push('제품 '+c.p[0]+'→'+c.p[1]);
        return '<li>'+md(c.d)+' '+parts.join(' · ')+'</li>';
      }).join('');
    }
  }
  window.addEventListener('message', async function(ev){
    if(done || ev.origin!==CMS || ev.source!==src || !ev.data || ev.data.nonce!==nonce) return;
    if(ev.data.type==='unpa-sync-progress'){ st.textContent=String(ev.data.text||'').slice(0,120); return; }
    if(ev.data.type!=='unpa-sync-data') return;
    done=true;
    var res;
    try{ res=await apply(ev.data.payload); }catch(e){ res={ok:false,error:String(e&&e.message||e)}; }
    show(res);
    try{ src.postMessage(Object.assign({type:'unpa-sync-done',nonce:nonce,seq:ev.data.payload&&ev.data.payload.seq},res,{ignored:ignoredIds()}), CMS); }catch(e){}
    setTimeout(function(){ window.close(); }, res.ok ? (res.nChanges ? 6000 : 2500) : 15000);
  });
  /* 서버 무시 목록은 길어야 몇 초만 기다린다 — 늦으면 이 브라우저 것으로 먼저 시작하고, 반영 끝에 다시 알린다 */
  (async function(){
    try{ var c=await within(CLOUD, 5000); if(c) await within(pullExc(c), 5000); }catch(e){}
    src.postMessage({type:'unpa-sync-ready',nonce:nonce,ignored:ignoredIds()}, CMS);
  })();
  setTimeout(function(){ if(!done) st.textContent='콘솔 응답이 없습니다. 이 창을 닫고 콘솔에서 다시 시도하세요.'; }, 60000);
})();
</script>
</body>
</html>
